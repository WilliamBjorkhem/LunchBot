name: Build lunch report

on:
  workflow_dispatch:
    inputs:
      json_file:
        description: Path to a JSON file in the repository
        required: true
        default: src/test/resources/sample-restaurant.json
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Generate HTML report
        env:
          JSON_FILE: ${{ inputs.json_file }}
        run: |
          test -f "$JSON_FILE" || {
            echo "JSON file not found: $JSON_FILE"
            exit 1
          }
          mvn -B compile exec:java \
            -Dexec.args="$JSON_FILE"

      - name: Upload report and image
        uses: actions/upload-artifact@v4
        with:
          name: lunch-report
          path: |
            target/lunch-report.html
            target/images/lunch-time.png
          if-no-files-found: error
