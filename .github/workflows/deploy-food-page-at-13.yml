name: Deploy food page at 13:00 Stockholm time

on:
  schedule:
    - cron: "0 11,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Stockholm time
        id: stockholm-time
        shell: bash
        run: |
          stockholm_hour="$(TZ=Europe/Stockholm date +'%H')"
          if [[ "$stockholm_hour" == "13" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment; it is currently ${stockholm_hour}:00 in Stockholm."
          fi

      - name: Check out repository
        if: steps.stockholm-time.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: steps.stockholm-time.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare page artifact
        if: steps.stockholm-time.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp food.html _site/index.html

      - name: Upload page artifact
        if: steps.stockholm-time.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.stockholm-time.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
