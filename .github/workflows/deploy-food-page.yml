name: Deploy food page to GitHub Pages

on:
  workflow_run:
    workflows: [Build lunch report]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download lunch report
        uses: actions/download-artifact@v4
        with:
          name: lunch-report
          path: report-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare page artifact
        run: |
          mkdir -p _site/images
          cp report-artifact/lunch-report.html _site/index.html
          cp report-artifact/lunch-report.html _site/food.html
          cp report-artifact/images/lunch-time.png _site/images/lunch-time.png

      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
